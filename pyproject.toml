[project]
name = "opspilot"
version = "0.1.0"
description = "OpsPilot AI — an incident-management assistant built as a hands-on lab series for learning AI/LLM integration patterns."
authors = [
    { name = "Maciej Szarliński", email = "mszarlinski@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "python-dotenv>=1.2.4",
    "anthropic>=2.2.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "httpx>=0.27",
]

[tool.uv]
package = false
