[project]
name = "opspilot"
version = "0.1.0"
description = "OpsPilot AI — an incident-management assistant built as a hands-on lab series for learning AI/LLM integration patterns."
authors = [
    { name = "Maciej Szarliński", email = "mszarlinski@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "python-dotenv>=1.2.4",
    "anthropic>=2.2.0",
    "chromadb>=0.5",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "httpx>=0.27",
    "ruff>=0.14",
]

[tool.uv]
# chromadb pulls onnxruntime for its default (local) embedding function.
# onnxruntime dropped macOS x86_64 wheels after 1.23, so cap it here.
constraint-dependencies = ["onnxruntime<1.24"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
# Ruff's defaults (pyflakes + the pycodestyle subset that catches real bugs),
# plus import sorting, which is where this project actually drifted.
# E501 is deliberately absent: the eval cases in tests are long prose strings.
select = ["E4", "E7", "E9", "F", "I"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
